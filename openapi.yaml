                            schema:
                                $ref: '#/components/schemas/VenueAvailabilityResponseBody'
            x-hduhelp-http: {'auth': 'public'}
    /hduhelp-neo/campuslife/venues/bookable-dates:
        get:
            tags:
                - CampusLifeService
            summary: 查询场馆可预约日期
            description: 用户询问某个场馆什么时候可以预约时首先调用，只传场馆。venueBookable=false 表示该场馆当前明确不可预约，直接告知用户且不要继续查询；venueBookable=true 时向用户展示 dates 并等待选择，然后再查询所选日期的具体可预约时段。dates 在缓存未命中时根据上游服务器时间、days_can_appoint、开放规则和实时场地占用计算，按上海时区换日；日期汇总最多缓存 1 小时，具体场次仍由时段接口实时查询。
