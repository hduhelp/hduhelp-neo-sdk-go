        post:
            tags:
                - UploadService
            summary: 签发直传地址
            description: 校验 filename/size/content_type 后生成对象 key 与短期 PUT URL，并预登记元数据行；客户端 PUT 到该 URL 即可用 key 引用，无需回调。第三方用户令牌需携带 upload:file:write。
            operationId: UploadService_SignUpload
            security:
                - BearerAuth: []
            requestBody:
                description: |-
                    签名直传：sign 校验元数据、为后端生成对象 key、签发短期 PUT URL，并同时预登记元数据行。
                    客户端不得自行指定 key；PUT 到 uploadUrl 完成后即可用 key 引用，无需二次回调。
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SignUploadRequestBody'
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
