                - UploadService
            summary: 上传头像(本地存储兜底)
            description: multipart 表单字段 file；仅用于不支持签名直传的存储。服务端固定 usage=avatar、嗅探真实内容类型，并要求 upload:file:write。
            operationId: UploadService_UploadAvatar
            security:
                - BearerAuth: []
            requestBody:
                required: true
                description: |-
                    First-party avatar fallback for stores that cannot issue a signed PUT URL.
                    There is deliberately no caller-controlled usage field: the handler always
                    persists this upload in the avatar bucket.
                content:
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/AvatarUploadRequestBody'
            responses:
                "200":
