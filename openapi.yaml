                - name: date
                  in: query
                  description: 必填。用户从 campuslife venues bookable-dates 返回的 dates 中选择的日期，格式为 YYYY-MM-DD。
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
