                    format: int32
                height:
                    type: integer
                    format: int32
            description: |-
                PostImageInput 是发布与编辑时提交的一张图片。宽高由客户端提供——服务端不解码图片，
                而瀑布流必须在图片加载前就知道比例才能占位；不提供则前端只能等图片加载完再回填布局。
