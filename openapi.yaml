    /hduhelp-neo/open-apis/authen/authorize:
        get:
            tags:
                - IdentityService
            summary: 授权码（用户同意）
            description: 已登录用户在一方同意页明确选择本次授权身份并同意授权某应用后，返回一次性授权码 code，用于换取 user_access_token。base 始终可选；非 base 身份必须已绑定。scope 为逗号分隔的用户权限子集。
            operationId: IdentityService_AuthenAuthorize
            security: []
            parameters:
                - name: app_id
                  in: query
                  schema:
                    type: string
                - name: redirect_uri
                  in: query
                  schema:
                    type: string
                - name: scope
                  in: query
                  description: 逗号分隔，用户权限范围子集
                  schema:
                    type: string
                - name: state
                  in: query
                  schema:
                    type: string
                - name: response_type
                  in: query
                  description: 固定 code
                  schema:
                    type: string
                - name: code_challenge
                  in: query
                  description: PKCE 挑战 (RFC 7636)
                  schema:
                    type: string
                - name: code_challenge_method
                  in: query
                  description: S256|plain
                  schema:
                    type: string
                - name: consent
                  in: query
                  description: true=用户已在一方页面明确同意
                  schema:
                    type: boolean
                - name: identity_type
                  in: query
                  description: consent=true 时由一方授权页提交；base 或当前用户已绑定的校园身份
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthenAuthorizeRespBody'
            x-hduhelp-http: {'auth': 'public_or_native_session'}
