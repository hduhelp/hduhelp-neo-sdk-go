                  in: query
                  schema:
                    type: array
                    items:
                        type: integer
                        format: int32
                - name: schoolYear
                  in: query
                  description: 学年，格式 YYYY-YYYY；省略时使用当前教学学期。
                  schema:
                    pattern: ^[0-9]{4}-[0-9]{4}$
                    type: string
                - name: semester
                  in: query
                  description: 学期编号，只能为 1、2 或 3。
                  schema:
                    maximum: !!float 3
                    minimum: !!float 1
                    enum:
                        - 1
                        - 2
                        - 3
                    type: integer
                    format: int32
                - name: limit
                  in: query
                  description: 单页最多返回教室数，1-200。MCP 省略时默认 50；REST 旧客户端省略时保持兼容。
                  schema:
                    maximum: !!float 200
                    minimum: !!float 1
                    type: integer
                    format: int32
                - name: offset
                  in: query
                  description: 从第几条开始返回，从 0 计数；继续翻页时使用上一页 pagination.nextOffset。
                  schema:
                    type: integer
                    format: int32
