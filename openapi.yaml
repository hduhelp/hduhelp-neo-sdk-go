                required: true
                description: |-
                    UploadRequest keeps the runtime query value and the multipart contract in one
                    source of truth. The handler reads the file with c.FormFile because Hertz's
                    generated string binding does not represent a multipart.FileHeader; the
                    OpenAPI override correctly publishes the field as a binary upload.
                content:
