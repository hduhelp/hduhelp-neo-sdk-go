            operationId: CampusLifeService_GetVenueAvailability
            security: []
            parameters:
                - name: venue
                  in: query
                  description: 必填。要查询的球馆，可输入羽毛球、羽毛球馆、综合馆羽毛球、网球、网球馆或穹顶网球场；当前官网个人预约只开放羽毛球和网球。
